[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packaudit"
version = "0.1.0"
description = "CLI tool to audit daily shipment CSVs against scan records"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
packaudit = "packaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
